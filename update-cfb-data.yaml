name: Update CFB schedule data

on:
  schedule:
    # Every 30 min. Public repos get unlimited Actions minutes, and this keeps
    # live scores reasonably fresh on Saturdays.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Build schedule
        run: python cfb_build.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json docs/schedule.json
          if ! git diff --staged --quiet; then
            git commit -m "Update CFB schedule data [skip ci]"
            git push
          fi